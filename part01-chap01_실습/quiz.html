<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ch01 복습 퀴즈</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2129;
    --muted: #6b7280;
    --border: #e3e6eb;
    --accent: #3b5bdb;
    --correct: #2f9e44;
    --correct-bg: #ebfbee;
    --wrong: #e03131;
    --wrong-bg: #fff5f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .tag { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #edf2ff; color: var(--accent); margin-bottom: 12px; }
  .question { font-size: 1.1rem; font-weight: 600; margin: 0 0 20px; }
  code { background: #f1f3f5; padding: 1px 6px; border-radius: 4px; font-size: .92em; }
  .options { display: grid; gap: 10px; }
  .options.ox { grid-template-columns: 1fr 1fr; }
  .opt {
    text-align: left; font: inherit; color: inherit;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 12px 16px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .options.ox .opt { text-align: center; font-size: 1.6rem; font-weight: 700; padding: 18px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--correct); background: var(--correct-bg); }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .explain { margin-top: 20px; padding: 14px 16px; border-radius: 10px; font-size: .95rem; }
  .explain.ok { background: var(--correct-bg); border-left: 4px solid var(--correct); }
  .explain.no { background: var(--wrong-bg); border-left: 4px solid var(--wrong); }
  .explain strong { display: block; margin-bottom: 4px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 600; border: none; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; background: var(--accent); color: #fff;
  }
  .btn.secondary { background: #e9ecef; color: var(--text); }
  .score { text-align: center; padding: 8px 0 16px; }
  .score .big { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1.2; }
  .wrong-list { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .wrong-list li { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: .92rem; }
  .wrong-list .ans { color: var(--correct); font-weight: 600; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Claude Code 딥다이브 Ch01 복습 퀴즈</h1>
  <p class="sub">「part01-chap01 내용 정리」 기반 · 객관식 10 + OX 5</p>

  <section id="quiz">
    <div class="progress"><div id="bar"></div></div>
    <div class="meta"><span id="count"></span><span id="mode"></span></div>
    <div class="card">
      <span class="tag" id="type"></span>
      <p class="question" id="question"></p>
      <div class="options" id="options"></div>
      <div id="explain" class="explain hidden"></div>
      <div class="actions"><button class="btn hidden" id="next"></button></div>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="card">
      <div class="score">
        <div class="big" id="score"></div>
        <div id="score-text"></div>
      </div>
      <ul class="wrong-list" id="wrong-list"></ul>
      <div class="actions">
        <button class="btn secondary" id="restart">처음부터 다시</button>
        <button class="btn" id="retry">오답 다시 풀기</button>
      </div>
    </div>
  </section>
</main>

<script src="dist/quiz.js"></script>
<script>Quiz.mount(document);</script>
</body>
</html>
